<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700" />
	<link rel="stylesheet" href="css/style.css"/>

    <meta charset="UTF-8" />

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <!--[if !mso]><!-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--<![endif]-->

    <meta name="x-apple-disable-message-reformatting" />


    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div style="display: inline-block; width: 1480px" data-ignore="used only for top most containter width">
      <div class="main-content-wrapper_mv">
        <div class="hero-section_mv">
          <div class="flex-container-with-spacing_mv">
            <img src="assets/image_919e1f15.png" class="main-image-container_mv" />
            <div class="header-section_mv">
			<a href="index.html">
              <p class="main-heading-text-style_mv">Главная</p>
			</a>
              <div class="horizontal-flex-container_mv">
                <img src="assets/image_63299395.png" class="image-container-styles_mv" />
				<a href="login.html">
                <img src="assets/image_ae0cfcb8.png" class="image-container-with-border_mv" />
				</a>
              </div>
            </div>
          </div>
          <div class="login-form-container_mv3_mv">
            <div class="login-form-container_mv1_mv">
              <div class="login-form-container_mv">
                <div class="account-login-form-container_mv_mv1_mv_mv">
                  <div class="account-login-form-container_mv_mv">
                    <div class="pink-box-with-title_mv">
                      <p class="login-heading-style_mv">Вход&nbsp; в аккаунт</p>
                    </div>
                    <div class="login-form-container_mv2_mv">
					  <div class="login-container_mv">
						<label class="login-label-style_mv" for="username">Логин:</label>
						<input type="text" id="username" class="login-container_mv1_mv" placeholder="Введите логин" />
					  </div>
					  <div class="password-container_mv">
						<label class="login-label-style_mv" for="password">Пароль:</label>
						<input type="password" id="password" class="password-field-container_mv" placeholder="Введите пароль" />
					  </div>
					  <div class="login-button-container_mv">
						<button id="loginButton" class="pink-box-with-title_mv1_mv">Войти</button>
					  </div>
					</div>
                  </div>
                </div>
				<a href="order.html">
                <div class="subscription-promo-container_mv">
                  <div class="subscription-prompt_mv-container_mv">
                    <p class="subscription-prompt_mv">Нет подписки? Купите сейчас!</p>
                  </div>
                </div>
				</a>
              </div>
            </div>
            <div class="flex-container-with-links_mv">
              <div class="header-section_mv">
                <img src="assets/image_919e1f15.png" class="hero-image_mv" />
                <p class="hero-text-block_mv">
                  <span>Arfenon<br /></span><span class="corporate-banner-text-style_mv">О нас<br />Работа в Arfenon</span>
                </p>
              </div>
              <div class="newsletter-section_mv">
                <div class="subscribe-section_mv">
                  <p class="subscribe-heading_mv">ПОДПИСЫВАЙТЕСЬ:</p>
                  <div class="subscribe-container_mv">
                    <img src="assets/image_2d0ccd10.png" class="image-container-compact_mv" />
                    <img src="assets/image_e3cbbb56.png" class="image-thumbnail-display-style_mv" />
                    <img src="assets/image_1142d104.png" class="image-box_mv" />
                    <img src="assets/image_adc83c9f.png" class="image-container-styled_mv" />
                    <img src="assets/image_39ec17e6.png" class="image-container-compact_mv" />
                  </div>
                </div>
                <p class="navigation-links-container_mv">
                  <span class="header-title_mv">Помощь<br /></span><span class="info-box_mv">Вопросы и ответы<br />Список устройств<br />Контакты</span>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
	<script src="js/login.js"></script>
	<div id="feedback-section">
  <h3>Обратная связь</h3>
  <textarea id="feedback-text" rows="4" cols="50" placeholder="Ваш отзыв..."></textarea><br><br>
  <button id="submit-feedback">Отправить</button>
	</div>
	<script src="js/javascript.js"></script>
  </body>
</html>
